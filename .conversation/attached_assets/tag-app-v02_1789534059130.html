<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15181B">
<title>TAG — Share the ride. Split the cost.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   TAG v0.2 — design system
   Ink on warm paper, one deep commuter-green, Space Grotesk display.
   ===================================================================== */
:root{
  --ink:#15181B; --ink-2:#3A403C; --muted:#6A706C; --faint:#9BA09B;
  --paper:#F6F5F1; --surface:#FFFFFF; --line:#E5E3DB; --wash:#EFEDE6;
  --brand:#0E7A52; --brand-deep:#0A5C3E; --brand-tint:#E3F1E9; --brand-line:#BFDCCB;
  --warn:#9A6A10; --warn-tint:#FBF3DF;
  --err:#B3372A; --err-tint:#FBEDEA;
  --r:16px;
  --disp:'Space Grotesk',-apple-system,'Segoe UI',sans-serif;
  --body:'Inter',-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--body); background:#E9E7E0; color:var(--ink);
  font-size:16px; line-height:1.55; min-height:100vh;
}
#frame{max-width:480px;margin:0 auto;background:var(--paper);min-height:100vh;position:relative;
  box-shadow:0 0 0 1px rgba(21,24,27,.05),0 18px 60px rgba(21,24,27,.10)}
@media(max-width:492px){#frame{box-shadow:none}body{background:var(--paper)}}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
input,textarea{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;
  padding:14px 16px;font-size:16px;outline:none;transition:border-color .15s}
input:focus,textarea:focus{border-color:var(--ink)}
input::placeholder,textarea::placeholder{color:var(--faint)}
a{color:var(--brand-deep);text-decoration:none;font-weight:500}

/* ---- type ---- */
.display{font-family:var(--disp);font-weight:700;letter-spacing:-.035em;line-height:1.02;font-size:clamp(40px,11.5vw,48px)}
.h1{font-family:var(--disp);font-weight:700;letter-spacing:-.03em;line-height:1.1;font-size:30px}
.h2{font-family:var(--disp);font-weight:700;letter-spacing:-.02em;font-size:22px}
.h3{font-weight:600;font-size:16.5px;letter-spacing:-.01em}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--brand-deep)}
.eyebrow.gray{color:var(--faint)}
.lead{font-size:17px;color:var(--ink-2);line-height:1.55}
.sub{font-size:15px;color:var(--muted)}
.small{font-size:13.5px}
.dim{color:var(--muted)}
.center{text-align:center}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}.mt28{margin-top:28px}.mt36{margin-top:36px}

/* ---- buttons ---- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;
  border-radius:14px;font-size:16.5px;font-weight:600;letter-spacing:-.01em;font-family:var(--body);
  transition:transform .06s ease;user-select:none}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--brand);color:#fff}
.btn-ink{background:var(--ink);color:#fff}
.btn-outline{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn-soft{background:var(--wash);color:var(--ink)}
.btn-quiet{background:transparent;color:var(--muted);min-height:46px;font-weight:500}
.btn-danger{background:transparent;color:var(--err);border:1.5px solid var(--err)}
.btn-sm{min-height:44px;font-size:15px;border-radius:12px}
.btn-row{display:flex;gap:10px}
.btn svg{width:19px;height:19px;stroke:currentColor;flex:0 0 auto}

/* ---- structure ---- */
.wrap{padding:0 22px}
.screen-head{padding:16px 22px 8px;display:flex;align-items:center;gap:12px;min-height:62px}
.screen-head .title{font-family:var(--disp);font-size:23px;font-weight:700;letter-spacing:-.02em;flex:1}
.back{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line);background:var(--surface);flex:0 0 auto}
.back svg{width:19px;height:19px;stroke:var(--ink)}
#app>.screen{animation:rise .26s cubic-bezier(.2,.7,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---- cards ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card+.card{margin-top:12px}
.card.quiet{background:transparent}
.hr{height:1px;background:var(--line);margin:14px 0}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;border-radius:6px;padding:3px 8px}
.pill.demo{color:var(--warn);background:var(--warn-tint)}
.pill.live{color:var(--brand-deep);background:var(--brand-tint)}
.pill.gray{color:var(--muted);background:var(--wash)}
.pill.err{color:var(--err);background:var(--err-tint)}

/* ---- route viz ---- */
.viz{display:block;width:100%;height:auto}
.viz .rp{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;opacity:.9}
.viz .rp.mut{opacity:.45}
.viz .rm{fill:none;stroke:var(--brand);stroke-width:3.5;stroke-linecap:round}
.viz .nd{fill:var(--surface);stroke:var(--ink);stroke-width:2}
.viz .nd.brand{fill:var(--brand);stroke:var(--brand)}
.viz text{font-family:var(--body);font-size:11px;fill:var(--muted);font-weight:500}
.viz .lb{font-weight:600;fill:var(--ink);font-size:12px}
.viz .draw{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 1.1s .15s cubic-bezier(.4,0,.2,1) forwards}
.viz .draw.d2{animation-delay:.4s}
@keyframes draw{to{stroke-dashoffset:0}}

/* ---- chips / steps ---- */
.option{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:18px;transition:border-color .15s}
.option:active{border-color:var(--ink)}
.option .ic{width:48px;height:48px;border-radius:14px;background:var(--brand-tint);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.option .ic svg{width:23px;height:23px;stroke:var(--brand-deep)}
.option .t{font-family:var(--disp);font-size:18px;font-weight:600;letter-spacing:-.01em}
.option .d{font-size:14px;color:var(--muted);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.timeinput{display:flex;align-items:center;gap:12px}
.timeinput input{font-size:21px;font-weight:600;padding:12px 16px;width:auto;flex:1}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:9px 16px;
  font-size:15px;font-weight:500;color:var(--ink-2)}
.chip.on{border-color:var(--ink);background:var(--ink);color:#fff}
.chip.mini{padding:6px 12px;font-size:13px}
.steps{display:flex;gap:5px}
.steps i{flex:1;height:3px;border-radius:99px;background:var(--line)}
.steps i.on{background:var(--brand)}
.field{margin-top:18px}
.field label{display:block;font-size:13px;font-weight:600;letter-spacing:.01em;color:var(--ink-2);margin-bottom:7px}
.choice{display:block;width:100%;text-align:center;border:1.5px solid var(--line);background:var(--surface);
  border-radius:14px;padding:17px 10px;font-size:16px;font-weight:600}
.choice.on{border-color:var(--ink);background:var(--ink);color:#fff}

/* ---- compare rows (your commute vs theirs) ---- */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp .col{background:var(--wash);border-radius:12px;padding:12px 14px}
.cmp .col .who{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.cmp .col .what{font-size:15px;font-weight:600;margin-top:4px;line-height:1.4}

/* ---- meters / score ---- */
.meter{height:5px;background:var(--wash);border-radius:99px;overflow:hidden;flex:1}
.meter i{display:block;height:100%;background:var(--brand);border-radius:99px}
.mrow{display:flex;align-items:center;gap:12px;margin:9px 0}
.mrow .ml{flex:0 0 118px;font-size:13.5px;color:var(--muted)}
.mrow .mv{flex:0 0 34px;text-align:right;font-size:13.5px;font-weight:600}
.score{font-family:var(--disp);font-weight:700;font-size:26px;letter-spacing:-.02em;color:var(--brand-deep)}

/* ---- match card ---- */
.match{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;
  animation:rise .3s both}
.match:nth-child(2){animation-delay:.05s}
.match:nth-child(3){animation-delay:.1s}
.match .head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.match .route{font-family:var(--disp);font-size:18px;font-weight:700;letter-spacing:-.01em;margin-top:6px}

/* ---- lists / timeline ---- */
.rowitem{display:flex;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid var(--line)}
.rowitem:last-child{border-bottom:none}
.tl{list-style:none}
.tl li{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.tl li:last-child{border-bottom:none}
.tl .dot{width:9px;height:9px;border-radius:50%;background:var(--brand);margin-top:6px;flex:0 0 auto}
.tl .dot.gray{background:var(--faint)}
.tl .when{font-size:12px;color:var(--faint);font-weight:500}
.tl .what{font-size:15px;font-weight:600}

/* ---- settings ---- */
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:none}
.switch{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:0 0 auto;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s}
.switch.on{background:var(--brand)}
.switch.on::after{left:21px}

/* ---- nav ---- */
#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
  background:rgba(246,245,241,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);
  display:none;z-index:40;padding-bottom:env(safe-area-inset-bottom)}
#nav.show{display:flex}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 8px;
  color:var(--faint);font-size:11px;font-weight:500}
#nav button svg{width:22px;height:22px;stroke:currentColor}
#nav button.on{color:var(--brand-deep)}

/* ---- sheet / toast ---- */
#overlay{position:fixed;inset:0;background:rgba(21,24,27,.45);z-index:60;display:none;align-items:flex-end;justify-content:center}
#overlay.show{display:flex}
.sheet{width:100%;max-width:480px;background:var(--paper);border-radius:20px 20px 0 0;
  padding:22px 22px calc(24px + env(safe-area-inset-bottom));animation:up .25s cubic-bezier(.2,.7,.2,1);
  max-height:88vh;overflow:auto}
@keyframes up{from{transform:translateY(36px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 16px}
#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-90px);background:var(--ink);
  color:#fff;font-size:14px;font-weight:500;border-radius:12px;padding:11px 18px;z-index:80;
  transition:transform .3s cubic-bezier(.2,.7,.2,1);max-width:88vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}

/* ---- skeletons ---- */
@keyframes pulse{50%{opacity:.45}}
.skel{background:var(--wash);border-radius:10px;animation:pulse 1.2s ease infinite}

/* ---- admin ---- */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat .n{font-family:var(--disp);font-size:24px;font-weight:700;letter-spacing:-.02em}
.stat .l{font-size:12.5px;color:var(--muted);margin-top:1px}
.fr{display:flex;align-items:center;gap:10px;margin:8px 0}
.fr .fl{flex:0 0 116px;font-size:13px;color:var(--ink-2)}
.fr .bar{flex:1;height:20px;background:var(--wash);border-radius:5px;overflow:hidden;position:relative}
.fr .bar i{position:absolute;inset:0;background:var(--brand);border-radius:5px}
.fr .fc{flex:0 0 30px;text-align:right;font-size:13px;font-weight:600}
.dtable .dr{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.dtable .dr:last-child{border-bottom:none}
.dtable .dr b{font-weight:600}
.footnote{text-align:center;font-size:12.5px;color:var(--faint);padding:8px 0 26px;line-height:1.6}
.notice{display:flex;gap:12px;background:var(--brand-tint);border-radius:12px;padding:14px 16px;font-size:14px;color:var(--brand-deep)}
.notice svg{width:19px;height:19px;stroke:var(--brand-deep);flex:0 0 auto;margin-top:2px}
.notice.warn{background:var(--warn-tint);color:var(--warn)}
.notice.warn svg{stroke:var(--warn)}
.errorbox{background:var(--err-tint);border-radius:14px;padding:20px;text-align:center}
.errorbox .t{font-weight:600;font-size:16.5px;color:var(--err)}
.errorbox .d{font-size:14px;color:var(--err);opacity:.75;margin-top:4px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--ink);color:#fff;font-weight:600;font-size:16px;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.avatar.sm{width:34px;height:34px;font-size:13px}
.avatar.lg{width:60px;height:60px;font-size:22px}
.empty-art{width:60px;height:60px;border-radius:18px;background:var(--brand-tint);display:flex;align-items:center;justify-content:center;margin:0 auto}
.empty-art svg{width:28px;height:28px;stroke:var(--brand-deep)}
input[type=checkbox]{width:auto;accent-color:var(--brand)}
.consent{display:flex;gap:12px;align-items:flex-start;background:var(--wash);border-radius:12px;padding:14px}
.consent input{margin-top:3px}
</style>
</head>
<body>
<div id="frame">
  <div id="app"></div>
  <nav id="nav"></nav>
  <div id="overlay"><div class="sheet" id="sheet"></div></div>
  <div id="toast"></div>
</div>
<script>
/* =====================================================================
   TAG v0.2 — core: icons, route visualizations, state, demo data,
   matching engine, analytics. All demo users are FICTIONAL (demo mode).
   ===================================================================== */
'use strict';

/* ---------------- helpers ---------------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>'id'+Math.random().toString(36).slice(2,10);
const DAY_ORDER=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const AREAS=['Kankarbagh','Rajendra Nagar','Bailey Road','Danapur','Boring Road','Patna Airport','Patna Junction','Patliputra','Gandhi Maidan','Patna'];
function fmtTime(t){ if(!t) return ''; let[h,m]=t.split(':').map(Number); const ap=h>=12?'PM':'AM'; h=h%12||12; return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+' '+ap; }
function mins(t){ if(!t) return 0; const[h,m]=t.split(':').map(Number); return h*60+m; }
function fmtDays(days){ if(!days||!days.length) return 'No days yet';
  const s=[...days].sort((a,b)=>DAY_ORDER.indexOf(a)-DAY_ORDER.indexOf(b));
  const wd=['Mon','Tue','Wed','Thu','Fri'];
  if(s.length===7) return 'Every day';
  if(s.length===5&&wd.every(d=>s.includes(d))) return 'Mon–Fri';
  if(s.length===6&&wd.every(d=>s.includes(d))) return 'Mon–Sat';
  return s.join(', ');
}
function niceDate(ts){ return new Date(ts).toLocaleDateString('en-IN',{month:'short',day:'numeric'}); }
function todayStr(){ return new Date().toLocaleDateString('en-IN',{month:'short',day:'numeric'}); }
function nextRideDay(days){ // next matching weekday after today
  for(let k=1;k<=7;k++){ const d=new Date(); d.setDate(d.getDate()+k);
    const name=DAY_ORDER[(d.getDay()+6)%7];
    if(days.includes(name)) return k===1?'Tomorrow':d.toLocaleDateString('en-IN',{weekday:'long'}); }
  return '—';
}

/* ---------------- icons ---------------- */
function ic(n){ const P={
  car:'<path d="M5 16l1.5-6a2 2 0 0 1 2-1.6h7A2 2 0 0 1 17.5 10L19 16v3h-2m-12 0v3H3v-3m2 0h10m1-5H4" stroke-linecap="round" stroke-linejoin="round"/>',
  person:'<circle cx="12" cy="7.5" r="3.5"/><path d="M5 20c.8-4 3.5-6 7-6s6.2 2 7 6" stroke-linecap="round"/>',
  home:'<path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z" stroke-linejoin="round"/>',
  route:'<circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.5 6H15a3 3 0 0 1 0 6H9a3 3 0 0 0 0 6h6.5" stroke-linecap="round"/>',
  activity:'<path d="M3 12h4l2.5-7 5 14 2.5-7H21" stroke-linecap="round" stroke-linejoin="round"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.4 4-6.5 8-6.5s7 2.1 8 6.5" stroke-linecap="round"/>',
  shield:'<path d="M12 3l7 3v6c0 4.4-3 7.7-7 9-4-1.3-7-4.6-7-9V6z" stroke-linejoin="round"/><path d="M9 12l2 2 4-4" stroke-linecap="round" stroke-linejoin="round"/>',
  arrow:'<path d="M12 4v16m0 0l-6-6m6 6l6-6" stroke-linecap="round" stroke-linejoin="round"/>',
  left:'<path d="M15 5l-7 7 7 7" stroke-linecap="round" stroke-linejoin="round"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5" stroke-linecap="round" stroke-linejoin="round"/>',
  clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2.5" stroke-linecap="round" stroke-linejoin="round"/>',
  share:'<circle cx="6" cy="12" r="2.5"/><circle cx="17.5" cy="6" r="2.5"/><circle cx="17.5" cy="18" r="2.5"/><path d="M8.2 10.9l7-4M8.2 13.1l7 4" stroke-linecap="round"/>',
  backup:'<path d="M12 3a9 9 0 1 1-8.5 6" stroke-linecap="round"/><path d="M3 3v6h6" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 8v4l3 2" stroke-linecap="round" stroke-linejoin="round"/>',
  flag:'<path d="M5 21V4m0 0h11l-2 3.5L16 11H5" stroke-linecap="round" stroke-linejoin="round"/>',
  gauge:'<path d="M5 19a9 9 0 1 1 14 0" stroke-linecap="round"/><path d="M12 13l3.5-4.5" stroke-linecap="round"/>',
  info:'<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 7.7v.3" stroke-linecap="round"/>',
  book:'<path d="M6 4h12v16H6a2 2 0 0 1 0-4h12" stroke-linejoin="round"/>',
  pin:'<path d="M12 21s-6.5-5.4-6.5-10.5a6.5 6.5 0 1 1 13 0C18.5 15.6 12 21 12 21z"/><circle cx="12" cy="10.5" r="2.3"/>'
}[n]||''; return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">'+P+'</svg>'; }

/* brand mark: two routes becoming one */
function mark(sz){ sz=sz||30; return `<svg width="${sz}" height="${sz}" viewBox="0 0 30 30" fill="none" aria-label="TAG">
<rect width="30" height="30" rx="9" fill="#0E7A52"/>
<path d="M8 10.5c4 0 4 4.5 7.5 4.5" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
<path d="M8 19.5c4 0 4-4.5 7.5-4.5" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
<path d="M15.5 15h6" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
<circle cx="8" cy="10.5" r="1.6" fill="#fff"/><circle cx="8" cy="19.5" r="1.6" fill="#fff"/><circle cx="23" cy="15" r="1.9" fill="#fff"/>
</svg>`; }

/* ---------------- route visualizations ---------------- */
/* hero: two commutes merging into one destination */
function vizHero(){ return `<svg class="viz" viewBox="0 0 360 200" role="img" aria-label="Two commute routes merging into one">
  <path class="rp draw" d="M24 60 C110 60 168 62 232 100"/>
  <path class="rp mut draw d2" d="M24 150 C110 150 168 148 232 100"/>
  <path class="rm draw d2" d="M232 100 H 322"/>
  <circle class="nd" cx="24" cy="60" r="5"/><circle class="nd" cx="24" cy="150" r="5"/>
  <circle class="nd brand" cx="326" cy="100" r="6"/>
  <text class="lb" x="24" y="42">Kankarbagh</text><text x="24" y="76">8:15 AM · Mon–Fri</text>
  <text class="lb" x="24" y="172">Rajendra Nagar</text><text x="24" y="136" opacity=".8">8:25 AM · Mon–Fri</text>
  <text class="lb" x="322" y="132" text-anchor="end">Patna Airport</text>
  <text x="277" y="82" text-anchor="middle" style="fill:#0E7A52;font-weight:600;font-size:11px;letter-spacing:.08em">ROUTE MATCH</text>

/* ---------------- matching engine (deterministic) ---------------- */
function normStr(s){ return (s||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(); }
function tokSet(s){ return new Set(normStr(s).split(' ').filter(Boolean)); }
function bigrams(s){ const t=normStr(s).replace(/ /g,''); const b=new Set(); for(let i=0;i<t.length-1;i++)b.add(t.slice(i,i+2)); return b; }
function diceSim(a,b){ const A=bigrams(a),B=bigrams(b); if(!A.size||!B.size) return 0; let n=0; A.forEach(x=>{if(B.has(x))n++;}); return 2*n/(A.size+B.size); }
function areaSim(a,b){
  if(!a||!b) return 0;
  const na=normStr(a), nb=normStr(b);
  if(!na||!nb) return 0;
  if(na===nb) return 1;
  const A=tokSet(a),B=tokSet(b); let inter=0; A.forEach(t=>{if(B.has(t))inter++;});
  const jac=inter/(A.size+B.size-inter);
  const contain=(na.includes(nb)||nb.includes(na))?0.9:0;
  return Math.max(jac, diceSim(a,b), contain);
}
function routeSim(ca,cb){ return Math.round(100*(0.5*areaSim(ca.from,cb.from)+0.5*areaSim(ca.to,cb.to))); }
function timeSim(t1,t2){ const d=Math.abs(mins(t1)-mins(t2)); return Math.round(100*Math.max(0,1-d/90)); }
function daySim(d1,d2){ const A=new Set(d1),B=new Set(d2); let i=0; A.forEach(d=>{if(B.has(d))i++;}); return A.size?Math.round(100*i/A.size):0; }
function seatSim(me,other){
  if(me.mode==='rider') return (other.mode==='driver'&&other.seats>0)?100:0;
  return other.mode==='rider'?100:0;
}
/* TAG compatibility: 40% route / 30% time / 20% days / 10% seats — a heuristic, not a science */
function compat(me,other){
  const r=routeSim(me,other), t=timeSim(me.time,other.time), d=daySim(me.days,other.days), s=seatSim(me,other);
  return {r,t,d,s,overall:Math.round(0.4*r+0.3*t+0.2*d+0.1*s)};
}
function overlapLabel(r){ return r>=80?'Strong route overlap':r>=60?'Good route overlap':'Partial route overlap'; }
function findMatches(commute){
  const out=[];
  DEMO_COMMUTES.forEach(dc=>{
    if(dc.mode===commute.mode) return;
    if(isBlocked(dc.user)) return;
    const c=compat(commute,dc);
    if(c.overall>=40 && c.r>=50 && !S.connections.some(x=>x.demoCommute===dc.id&&x.status!=='ended')) out.push({dc,c});
  });
  out.sort((a,b)=>b.c.overall-a.c.overall);
  return out;
}

/* ================= ACTIVITY ================= */
function screenActivity(){
  const items=[];
  const add=(t,what,sub)=>items.push({t,what,sub});
  if(S.commute) add(S.commute.createdTs||Date.now(),'Commute created',S.commute.from+' → '+S.commute.to);
  S.connections.forEach(c=>{
    const u=demoUser(c.user);
    if(c.acceptedAt) add(c.acceptedAt,'Connection accepted','You and '+u.name+' can coordinate now');
    else if(c.createdAt) add(c.createdAt,'Connection requested','Waiting for '+u.name);
    if(c.status==='ended') add(c.endedAt||Date.now(),'Commute ended','With '+u.name);
  });
  ridesFor(connActive()?connActive().id:'__').forEach(r=>add(r.t,'Ride completed','With '+demoUser((S.connections.find(c=>c.id===r.conn)||{}).user).name));
  if(S.recurring) add(S.recurring.since,'Recurring commute created','This is now a regular commute');
  S.events.filter(e=>e.name==='match_found').forEach(e=>add(e.t,'New matches','Compatible commuters found for your route'));
  S.events.filter(e=>e.name==='backup_requested').forEach(e=>add(e.t,'Backup requested'));
  S.events.filter(e=>e.name==='feedback_submitted').forEach(e=>add(e.t,'Feedback recorded'));
  if(S.pendingFeedback) add(Date.now(),'Feedback requested','How did your ride go?');
  items.sort((a,b)=>b.t-a.t);
  const pend=connPending();
  return `
  <div class="screen-head"><div class="title">Activity</div></div>
  <div class="wrap">
    ${pend?`
    <div class="card">
      <div class="eyebrow gray">Waiting for response</div>
      <div class="mt8" style="display:flex;gap:14px;align-items:center">
        <div class="avatar">${esc(demoUser(pend.user).name[0])}</div>

      </div>
    </div>`:''}
    ${items.length?`<ul class="tl mt16">${items.map(i=>`
      <li><div class="dot ${/ended/.test(i.what)?'gray':''}"></div><div>
        <div class="when">${niceDate(i.t)}</div><div class="what">${esc(i.what)}</div>
        ${i.sub?`<div class="small dim">${esc(i.sub)}</div>`:''}</div></li>`).join('')}</ul>`
    :`<div class="card center mt16"><div class="h3">Nothing yet</div><p class="small dim mt8">Connections, rides and matches will appear here.</p></div>`}
    <div style="height:24px"></div>
  </div>`;
}

    <div class="mt24" style="display:grid;gap:10px">${q2.map(x=>`<button class="choice ${FB.again===x?'on':''}" data-act="fb" data-arg="again|${x}">${x}</button>`).join('')}</div>
    <div class="mt24"><button class="btn btn-primary" data-act="fbNext">Continue</button></div>`;
  else body=`<div class="center"><div class="h1" style="font-size:25px">Are you still coordinating through TAG?</div></div>
    <div class="mt24" style="display:grid;gap:10px">${q3.map(x=>`<button class="choice ${FB.tag===x?'on':''}" data-act="fb" data-arg="tag|${x}">${x}</button>`).join('')}</div>

    <div class="mt16"><button class="btn btn-primary" data-act="fbDone">Done</button></div>`;
  return `<div class="wrap" style="padding-top:56px">${body}<div style="padding-bottom:28px"></div></div>`;
}
function fbDone(){
  S.feedback.push({id:uid(),rating:FB.rating,repeated:FB.again,continued:FB.tag,t:Date.now()});

function densityRows(){
  const all=[...(S.commute?[S.commute]:[]),...DEMO_COMMUTES];

  all.forEach(c=>{ const k=c.from+' → '+c.to; if(!corr[k])corr[k]={riders:0,providers:0,pairs:[]}; if(c.mode==='driver')corr[k].providers++; else corr[k].riders++; corr[k].list=(corr[k].list||[]).concat([c]); });
  return Object.entries(corr).map(([k,v])=>{
    let matches=0;
    v.list.filter(c=>c.mode==='rider').forEach(r=>{
      v.list.filter(c=>c.mode==='driver').forEach(d=>{ const m=compat(r,d); if(m.overall>=40&&m.r>=50)matches++; });
    });
    return {corridor:k,riders:v.riders,providers:v.providers,matches};
  }).sort((a,b)=>(b.riders+b.providers)-(a.riders+a.providers));
}

/* ================= INTERACTIONS ================= */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const act=el.getAttribute('data-act'), arg=el.getAttribute('data-arg');
  switch(act){
    case 'mode': go('mode'); break;
    case 'start': startCreate(arg); break;
    case 'back': goBack(); break;
    case 'go': go(arg); break;
    case 'nav': go(arg==='home'?(S.commute?'matches':'landing'):arg); break;
    case 'safety': go('safety'); break;
    case 'testers': go('testers'); break;
    case 'fill': { const[f,v]=arg.split('|'); F[f]=v; render(); break; }
    case 'day': { const i=F.days.indexOf(arg); if(i>=0)F.days.splice(i,1); else F.days.push(arg); render(); break; }
    case 'seats': F.seats=parseInt(arg,10); render(); break;
    case 'freq': F.freq=arg; render(); break;
    case 'next': createNext(); break;
    case 'prev': F.step--; render(); break;
    case 'retryCreate': closeSheet(); submitCommute(); break;
    case 'matches': case 'matches2': {
      if(S.simError){ S.screen='matches'; render(); openSheet(`
        <div class="errorbox"><div class="t">We couldn't load your matches.</div><div class="d">Check your connection and try again.</div>
        <div class="mt16"><button class="btn btn-primary" data-act="retryMatches">Try again</button></div></div>`); return; }
      matchesLoading=true; go('matches'); setTimeout(()=>{ matchesLoading=false; render(); },800); break; }
    case 'retryMatches': { closeSheet(); matchesLoading=true; S.screen='matches'; render(); setTimeout(()=>{ matchesLoading=false; render(); },800); break; }
    case 'view': S.matchId=arg; go('match'); break;
    case 'viewRoute': viewRouteSheet(arg); break;
    case 'saveMatch': { const i=S.saved.indexOf(arg); if(i>=0){S.saved.splice(i,1);toast('Removed from saved');} else {S.saved.push(arg);toast('Match saved');} save(); render(); break; }
    case 'connect': openConnectSheet(arg); break;
    case 'sendReq': sendRequest(arg); break;
    case 'demoAccept': acceptConn(arg); break;
    case 'shareContact': { const c=connActive(); if(c){ c.contactShared=true; track('contact_shared'); save(); render(); toast('Contact details shared with '+demoUser(c.user).name); } break; }
    case 'rideAgain': { const c=connActive(); if(!c) break; const u=demoUser(c.user);
      openSheet(`<div class="center"><div class="h2">Riding with ${esc(u.name)} today?</div>
      <p class="sub mt8">Log the ride once it's done — TAG uses this to learn whether commutes repeat.</p></div>
      <div class="mt20"><button class="btn btn-primary" data-act="logRide">Yes, we rode</button>
      <div class="mt12"></div><button class="btn btn-quiet" data-act="closeSheet">Not today</button></div>`); break; }
    case 'logRide': { const c=connActive(); if(!c) break;
      const ride={id:uid(),conn:c.id,date:todayStr(),t:Date.now(),status:'completed'};
      S.rides.push(ride); track('ride_scheduled'); track('ride_completed');
      if(ridesFor(c.id).length>=2) track('repeat_ride');
      closeSheet(); FB={step:1,rating:'',again:'',tag:''}; S.pendingFeedback=ride.id; save(); go('feedback'); break; }
    case 'fb': { const[k,v]=arg.split('|'); FB[k]=v; render(); break; }
    case 'fbNext': { if(FB.step===1&&!FB.rating){toast('Pick an answer to continue');break;} FB.step++; render(); break; }
    case 'fbDone': fbDone(); break;
    case 'makeRecurring': { S.recurring={since:Date.now()}; track('recurring_commute_started'); save(); toast('Recurring commute created'); go('commute'); break; }
    case 'editCommute': { const c=S.commute;
      F={step:1,from:c.from,to:c.to,time:c.time,arr:c.arr||'',days:c.days.slice(),seats:c.seats||0,freq:c.freq||'',note:c.note||''};
      go('create'); break; }
    case 'pauseCommute': { const c=S.commute; c.status=c.status==='paused'?'active':'paused';
      toast(c.status==='paused'?'Commute paused — hidden from matching':'Commute resumed'); save(); render(); break; }
    case 'reqBackup': { track('backup_requested',{target:arg}); toast('Backup requested — we\'ll reach out if your regular ride isn\'t available'); break; }
    case 'report': openSheet(`<div class="h2">Report a problem</div>
      <div class="field"><label>What happened?</label>
        <div class="chips" id="repwrap">${['Safety concern','No-show','Behaviour','Other'].map(r=>`<button class="chip mini" data-rep="${r}">${r}</button>`).join('')}</div></div>
      <div class="field"><label>Details (optional)</label><textarea id="rep_details" rows="3" placeholder="What went wrong?"></textarea></div>
      <div class="mt16"><button class="btn btn-primary" data-act="sendReport">Send report</button>
      <div class="mt12"></div><button class="btn btn-quiet" data-act="closeSheet">Cancel</button></div>`); break;
    case 'sendReport': { S.reports.push({id:uid(),reason:(document.querySelector('#repwrap .chip.on')||{}).textContent||'Other',details:($('#rep_details')||{}).value||'',t:Date.now()});
      track('report_created'); save(); closeSheet(); toast('Report recorded — a human will review it'); break; }
    case 'blockAny': case 'blockUser': {
      if(act==='blockUser'){ doBlock(arg); break; }
      const conn=connActive();
      openSheet(`<div class="h2">Block a user</div>
      ${conn?`<p class="sub mt8">Block ${esc(demoUser(conn.user).name)} (your current match)? They can't see or contact you afterwards.</p>`:`<p class="sub mt8">You have no active connections. Blocking applies to matched users from their profile.</p>`}
      <div class="mt16">${conn?`<button class="btn btn-danger" data-act="blockUser" data-arg="${conn.user}">Block ${esc(demoUser(conn.user).name)}</button>`:''}
      <div class="mt12"></div><button class="btn btn-quiet" data-act="closeSheet">Cancel</button></div>`); break; }
    case 'endConn': { const c=connActive(); if(c){ c.status='ended'; c.endedAt=Date.now(); track('ride_cancelled'); }
      S.activeConn=null; S.recurring=null; save(); toast('Commute ended'); go('commute'); break; }
    case 'share': shareInvite(); break;
    case 'copyInvite': copyInvite(); break;
    case 'closeSheet': closeSheet(); break;
    case 'tMode': T.mode=arg; render(); break;
    case 'tDay': { const i=T.days.indexOf(arg); if(i>=0)T.days.splice(i,1); else T.days.push(arg); render(); break; }
    case 'tFreq': T.freq=arg; render(); break;
    case 'testersSubmit': testersSubmit(); break;
    case 'toggleErr': S.simError=!S.simError; save(); render(); break;
    case 'reset': resetAll(); break;
    case 'admin': go('admin'); break;
    case 'adminCheck': { const v=[...document.querySelectorAll('.pinbox')].map(b=>b.value).join('');
      if(v===ADMIN_PIN){ S.adminOk=true; save(); render(); } else toast('Wrong PIN'); break; }
  }
});
function doBlock(userId){
  const u=demoUser(userId);
  openSheet(`<div class="center"><div class="h2">Block ${esc(u.name)}?</div>
  <p class="sub mt8">They won't be able to see or contact you. Any connection with them ends immediately.</p></div>
  <div class="mt20"><button class="btn btn-danger" data-act="doBlock" data-arg="${userId}">Yes, block ${esc(u.name)}</button>
  <div class="mt12"></div><button class="btn btn-quiet" data-act="closeSheet">Cancel</button></div>`);
}
/* report reason chips */
document.addEventListener('click',e=>{
  const c=e.target.closest('#repwrap .chip'); if(!c) return;
  [...document.querySelectorAll('#repwrap .chip')].forEach(x=>x.classList.remove('on'));
  c.classList.add('on');
});
document.addEventListener('input',e=>{
  if(e.target.classList&&e.target.classList.contains('pinbox')){
    const i=parseInt(e.target.getAttribute('data-i'),10);
    if(e.target.value&&i<3) document.querySelector(`.pinbox[data-i="${i+1}"]`).focus();
  }
  if(e.target.id==='p_name'){ S.name=e.target.value; save(); }
});

/* ================= INIT ================= */
(function init(){
  if(S.commute&&S.events.length){
    const last=S.events[S.events.length-1].t;
    if(Date.now()-last>60*60*1000) track('user_returned');
  }
  render();
})();
</script>
</div>
</body>
</html>
