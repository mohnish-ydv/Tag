kind = "web"
previewPath = "/"
title = "Tag commuter network"
description = "A polished consumer web app that helps commuters find people already travelling their route, share rides privately, and keep recurring commutes useful with matches, backups, and trust controls."
version = "1.0.0"
id = "artifacts/tag-commuter-network"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21975

[services.development]
run = "pnpm --filter @workspace/tag-commuter-network run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tag-commuter-network", "run", "build" ]
serve = "static"
publicDir = "artifacts/tag-commuter-network/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21975"
BASE_PATH = "/"
