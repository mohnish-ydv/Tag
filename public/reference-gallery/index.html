<!doctype html>

<title>Tag — Easy Ride Reference Gallery</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#fff;font-family:system-ui,sans-serif}
header{position:sticky;top:0;z-index:10;padding:18px 20px;background:#181818;border-bottom:1px solid #333}
h1{margin:0;font-size:20px}
p{margin:5px 0 0;color:#999;font-size:13px}
.grid{padding:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:18px}
.card{background:#1b1b1b;border:1px solid #333;border-radius:12px;padding:10px;cursor:pointer}
.card:hover{border-color:#777}
.card img{display:block;width:100%;height:auto;border-radius:7px;background:#fff}
.name{font-size:12px;color:#ccc;margin-top:9px;line-height:1.4;word-break:break-word}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:20;overflow:auto;padding:30px}
.overlay.open{display:flex;justify-content:center;align-items:flex-start}
.overlay img{max-width:min(393px,95vw);height:auto}
.close{position:fixed;top:15px;right:18px;font-size:30px;color:white;cursor:pointer}
</style>
</head>
<body>

<h1>Tag — Complete Easy Ride Visual Reference</h1>
<p id="count"></p>

files.forEach(file=>{
  const card=document.createElement('div');
  card.className='card';
  const img=document.createElement('img');
  img.loading='lazy';
  img.src='./'+encodeURIComponent(file);
  img.onclick=()=>openPreview(img.src);
  const name=document.createElement('div');
  name.className='name';
  name.textContent=file;
  card.append(img,name);
  grid.appendChild(card);
});

function openPreview(src){
 document.getElementById('preview').src=src;
 document.getElementById('overlay').classList.add('open');
}
function closePreview(){
 document.getElementById('overlay').classList.remove('open');
