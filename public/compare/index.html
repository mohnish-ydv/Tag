<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tag Visual Comparison</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  background:#202020;
  color:#fff;
  font-family:system-ui,-apple-system,sans-serif;
}

body{
  padding:24px;
}

h1{
  margin:0 0 6px;
  font-size:24px;
}

p{
  color:#aaa;
  margin:0 0 24px;
}

.compare{
  display:flex;
  gap:32px;
  flex-wrap:wrap;
  align-items:flex-start;
}

.panel{
  width:393px;
}

.label{
  margin-bottom:10px;
  font-weight:700;
  font-size:14px;
}

.frame{
  width:393px;
  height:852px;
  background:#fff;
  overflow:hidden;
  border-radius:12px;
  box-shadow:0 8px 40px rgba(0,0,0,.4);
}

.frame img{
  width:393px;
  height:852px;
  object-fit:cover;
  display:block;
}

iframe{
  width:393px;
  height:852px;
  border:0;
  display:block;
  background:#fff;
}

.controls{
  margin-bottom:24px;
}

button{
  border:1px solid #555;
  background:#292929;
  color:white;
  padding:9px 14px;
  border-radius:7px;
  cursor:pointer;
}

button:hover{
  background:#333;
}

@media(max-width:850px){
  body{padding:16px}

  .compare{
    gap:20px;
  }
}
</style>
</head>

<body>

<h1>Tag — Reference Comparison</h1>
<p>393 × 852 canonical viewport · Home screen</p>

<div class="controls">
  <button onclick="location.reload()">Refresh implementation</button>
</div>

<div class="compare">

  <section class="panel">
    <div class="label">REFERENCE — Easy Ride</div>
    <div class="frame">
      <img src="/Tag/reference/home-reference.png"
           alt="Reference Home Screen">
    </div>
  </section>

  <section class="panel">
    <div class="label">TAG — IMPLEMENTATION</div>
    <div class="frame">
      <iframe src="/Tag/"></iframe>
    </div>
  </section>

</div>

</body>
</html>
